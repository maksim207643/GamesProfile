<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

      :root {
        --bg: #0f0f14;
        --card: #1a1a24;
        --accent: #7c5cff;
        --accent-glow: rgba(124, 92, 255, 0.35);
        --text: #e8e8f0;
        --muted: #8888a0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .profile {
        width: 100%;
        max-width: 460px;
      }

      .avatar {
        width: 110px;
        height: 110px;
        margin: 0 auto 1.2rem;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #ff6bd6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.6rem;
        font-weight: 800;
        color: #fff;
        box-shadow: 0 0 30px var(--accent-glow);
        user-select: none;
      }

      h1 {
        text-align: center;
        font-size: 1.4rem;
        font-weight: 800;
        margin-bottom: 0.3rem;
      }

      .bio {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-bottom: 2rem;
      }

      .card {
        display: flex;
        align-items: center;
        gap: 1rem;
        background: var(--card);
        border: 1px solid #2a2a38;
        border-radius: 12px;
        padding: 0.9rem 1.1rem;
        margin-bottom: 0.7rem;
        text-decoration: none;
        color: var(--text);
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }

      .card:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        box-shadow: 0 6px 20px var(--accent-glow);
      }

      .icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        flex-shrink: 0;
        background: #252533;
      }

      .card-info {
        flex: 1;
        min-width: 0;
      }

      .platform {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
      }

      .nick {
        font-size: 1.05rem;
        font-weight: 600;
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .copy-btn {
        background: none;
        border: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 1.1rem;
        padding: 0.3rem;
        border-radius: 6px;
        transition: color 0.2s, background 0.2s;
        flex-shrink: 0;
      }

      .copy-btn:hover {
        color: var(--accent);
        background: #252533;
      }

      .copy-btn.copied {
        color: #4ade80;
      }

      .footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.75rem;
        margin-top: 1.5rem;
      }

      @media (max-width: 380px) {
        .avatar { width: 90px; height: 90px; font-size: 2.1rem; }
        h1 { font-size: 1.2rem; }
      }
    </style>
  </head>
  <body>
    <div class="profile">
      <div class="avatar" id="avatar">A</div>
      <h1 id="name">Твой ник</h1>
      <p class="bio">короткое описание о себе</p>

      <div id="cards"></div>

      <p class="footer">© 2026</p>
    </div>

    <script>
      // ── Данные профиля ──
      // Меняй значения на свои. Поле url — если платформа
      // поддерживает ссылку на профиль, иначе оставь пустым "".
      const profile = {
        name: "Твой ник",
        bio: "короткое описание о себе",
        avatarText: "A",
        links: [
          {
            platform: "Telegram",
            nick: "@username",
            url: "https://t.me/username",
            icon: "✈️",
          },
          {
            platform: "Minecraft",
            nick: "Steve",
            url: "",
            icon: "⛏️",
          },
          {
            platform: "Roblox",
            nick: "Player123",
            url: "https://www.roblox.com/users/profile?username=Player123",
            icon: "🟥",
          },
          {
            platform: "Discord",
            nick: "username",
            url: "",
            icon: "💬",
          },
          {
            platform: "Steam",
            nick: "steam_nick",
            url: "https://steamcommunity.com/id/steam_nick",
            icon: "🎮",
          },
        ],
      };

      // ── Заполнение страницы ──
      document.getElementById("name").textContent = profile.name;
      document.getElementById("avatar").textContent = profile.avatarText;
      document.querySelector(".bio").textContent = profile.bio;

      const cards = document.getElementById("cards");

      profile.links.forEach((link, i) => {
        const card = document.createElement("a");
        card.className = "card";
        if (link.url) {
          card.href = link.url;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
        }

        card.innerHTML = `
          <div class="icon">${link.icon}</div>
          <div class="card-info">
            <div class="platform">${link.platform}</div>
            <div class="nick">${link.nick}</div>
          </div>
        `;

        // Кнопка копирования ника
        const copyBtn = document.createElement("button");
        copyBtn.className = "copy-btn";
        copyBtn.title = "Скопировать ник";
        copyBtn.innerHTML = "⧉";
        copyBtn.addEventListener("click", (e) => {
          e.preventDefault();
          e.stopPropagation();
          navigator.clipboard.writeText(link.nick).then(() => {
            copyBtn.classList.add("copied");
            copyBtn.innerHTML = "✓";
            setTimeout(() => {
              copyBtn.classList.remove("copied");
              copyBtn.innerHTML = "⧉";
            }, 1200);
          });
        });
        card.appendChild(copyBtn);

        cards.appendChild(card);
      });
    </script>
  </body>
</html>
